<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="IPv4 price monitoring — live lease prices from the LARUS API and market purchase prices per RIR region">
    <title>IPv4 Price Aggregator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-row">
            <h1 data-i18n="app_title">📡 IPv4 Price Aggregator</h1>
            <select id="lang-select" aria-label="Language"></select>
        </div>
        <div class="header-row meta-row">
            <span id="mode-badge" class="badge" data-i18n="mode_session">Session monitoring</span>
            <span id="db-info" class="db-info hidden"></span>
            <span id="next-refresh" class="next-refresh"></span>
            <button id="about-btn" class="about-btn" data-i18n="about_title" title="Legend">?</button>
        </div>
    </header>

    <div id="error-banner" class="banner hidden"></div>

    <main class="container">
        <section class="controls">
            <div class="controls-col">
                <div class="control">
                    <label for="location-select" data-i18n="location_label">API location</label>
                    <select id="location-select">
                        <option value="US">US</option>
                        <option value="EU">EU</option>
                    </select>
                </div>
                <div class="control">
                    <label for="currency-select" data-i18n="currency_label">Currency</label>
                    <select id="currency-select">
                        <option value="USD" selected>USD $</option>
                        <option value="EUR">EUR €</option>
                        <option value="GBP">GBP £</option>
                        <option value="PLN">PLN zł</option>
                        <option value="UAH">UAH ₴</option>
                    </select>
                    <span id="rates-note" class="note hidden"></span>
                </div>
                <div class="control">
                    <button id="refresh-btn" data-i18n="refresh_now">🔄 Refresh now</button>
                </div>
            </div>

            <!-- Конвертер: регион + подсеть → цена, пересчёт в другие валюты
                 и сравнение со своей ценой за IP -->
            <div class="control conv">
                <div class="conv-left">
                    <div class="conv-selects">
                        <select id="conv-region" aria-label="Region"></select>
                        <select id="conv-block" aria-label="Subnet"></select>
                    </div>
                    <div class="conv-price">
                        <span id="conv-main" class="conv-main">—</span>
                        <span id="conv-range" class="conv-range"></span>
                    </div>
                    <div id="conv-alts" class="conv-alts"></div>
                </div>
                <div class="conv-right">
                    <div class="conv-headline">
                        <span id="conv-subnet" class="strong">/24</span>
                        <span id="conv-fee-head"></span>
                    </div>
                    <div class="conv-own">
                        <label for="conv-own-input" id="conv-own-label">Your price / IP</label>
                        <input id="conv-own-input" type="number" min="0" step="0.01" placeholder="0.00" inputmode="decimal">
                        <label for="conv-fee-input" id="conv-fee-label" class="fee-label">Broker, %</label>
                        <input id="conv-fee-input" type="number" min="0" step="0.1" value="1" inputmode="decimal">
                    </div>
                    <div id="conv-calc" class="conv-calc"></div>
                    <div id="conv-total" class="conv-total"></div>
                    <div id="conv-own-alts" class="conv-alts"></div>
                    <div id="conv-diff" class="conv-diff"></div>
                </div>
            </div>
        </section>

        <!-- Выбор размера подсети — общая строка вверху страницы -->
        <div class="chips" id="block-chips" aria-label="Block size"></div>

        <section class="card">
            <h2 data-i18n="purchase_title">Purchase prices by region</h2>
            <p class="note" data-i18n="purchase_hint"></p>
            <div class="chips" id="region-chips" aria-label="Region"></div>
            <div class="table-wrap">
                <table id="purchase-table">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="chart-wrap"><canvas id="chart-purchase"></canvas></div>
            <div id="chart-purchase-fallback" class="table-wrap hidden"></div>
        </section>

        <section class="card">
            <h2 data-i18n="table_title">Current lease prices by block</h2>
            <div class="metrics" id="metrics"></div>
            <div class="table-wrap">
                <table id="price-table">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="chart-wrap"><canvas id="chart-lease"></canvas></div>
            <div id="chart-lease-fallback" class="table-wrap hidden"></div>
        </section>

        <section class="card">
            <h2 id="history-title" data-i18n="chart_history">Lease history</h2>
            <p id="history-note" class="note"></p>
            <div class="chart-wrap"><canvas id="chart-history"></canvas></div>
            <div id="chart-history-fallback" class="table-wrap hidden"></div>
        </section>
    </main>

    <footer class="footer">
        <span data-i18n="footer_source">Data source: larus.net IPv4 API · source prices in USD</span>
        ·
        <a href="https://github.com/Michael-VT/ipv4_aggregator" target="_blank" rel="noopener">GitHub</a>
    </footer>

    <!-- Легенда: всплывающее окно по кнопке «?» в шапке -->
    <div id="about-modal" class="modal hidden">
        <div class="modal-box">
            <button id="about-close" class="modal-close" aria-label="Close">✕</button>
            <h2 data-i18n="about_title">📖 What this page shows</h2>
            <div id="about-body" class="about-body"></div>
        </div>
    </div>

    <!-- Chart.js через CDN (pinned); при недоступности CDN интерфейс
         автоматически переключается на текстовые таблицы -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
            integrity="sha384-vsrfeLOOY6KuIYKDlmVH5UiBmgIdB1oEf7p01YgWHuqmOHfZr374+odEv96n9tNC"
            crossorigin="anonymous"></script>
    <script src="i18n.js"></script>
    <script src="purchase_data.js"></script>
    <script src="app.js"></script>
</body>
</html>
